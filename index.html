<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>影片特效點子庫</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section class="hero">
    <p class="eyebrow">Video FX Ideas</p>
    <h1>影片特效點子庫</h1>
    <p id="count" class="count"></p>
  </section>

  <div class="bar">
    <div class="bar-inner">
      <input id="search" type="search" placeholder="搜尋：描邊、條紋、驚喜…" aria-label="搜尋特效">
      <div id="chips" class="segmented" role="group" aria-label="分類">
        <button data-cat="全部" class="chip active">全部</button>
        <button data-cat="字幕" class="chip">字幕</button>
        <button data-cat="轉場" class="chip">轉場</button>
        <button data-cat="特效" class="chip">特效</button>
      </div>
    </div>
  </div>

  <main>
    <div id="grid" class="grid"></div>
  </main>

  <dialog id="detail">
    <button id="close" class="close" aria-label="關閉">✕</button>
    <div id="detail-body"></div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
